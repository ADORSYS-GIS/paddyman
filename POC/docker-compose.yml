# =============================================================================
# POC/docker-compose.yml — Single Docker Compose definition for the POC project
# =============================================================================
#
# Usage:
#   cd POC
#   cp .env.example .env      # first time only
#   docker compose up airflow-init          # first run only
#   docker compose up -d airflow-scheduler airflow-webserver
#
# All services required by the platform are defined here.
# Do not create module-specific compose files.
# =============================================================================

# ── Shared env & volumes ──────────────────────────────────────────────────────

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  BERLIN_GROUP_DOWNLOAD_DIR: /opt/airflow/downloads
  YAML_SPEC_DIR: /opt/airflow/DataSource/yaml_spec
  ADORSYS_CODE_DIR: /opt/airflow/DataSource/code_projects
  # /opt/airflow/dags   — Airflow DAGs (DownloadTrigger)
  # /opt/airflow        — parent of poc_shared, making `import poc_shared` resolve
  PYTHONPATH: /opt/airflow/dags:/opt/airflow
  _PIP_ADDITIONAL_REQUIREMENTS: "python-gitlab>=4.0.0 dulwich>=0.21.0 gitpython>=3.1.0"

# All Airflow services load the single root env file.
x-airflow-env-file: &airflow-env-file
  - ./.env

x-airflow-volumes: &airflow-volumes
  # DAGs from the DownloadTrigger module
  - ./get_resources/DownloadTrigger/dags:/opt/airflow/dags:ro
  # POC shared package mounted as poc_shared — imported by dags/shared/settings.py
  - ./shared:/opt/airflow/poc_shared:ro
  # Non-sensitive app config
  - ./config.yml:/opt/airflow/config.yml:ro
  # Shared data directories
  - ./get_resources/DownloadTrigger/downloads:/opt/airflow/downloads
  - ./DataSource:/opt/airflow/DataSource

# ── Services ──────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # Ensures bind-mounted directories are writable by the airflow uid (50000)
  # and remain accessible to the host user running Docling outside Docker.
  # Preserves git repository ownership to avoid "dubious ownership" errors.
  perms-fix:
    image: alpine
    user: "0:0"
    command:
      - sh
      - -c
      - |
        mkdir -p /opt/airflow/downloads && \
        chown -R 50000:0 /opt/airflow/downloads && \
        chmod a+rwX /opt/airflow/DataSource && \
        mkdir -p /opt/airflow/DataSource/yaml_spec && \
        mkdir -p /opt/airflow/DataSource/code_projects && \
        mkdir -p /opt/airflow/DataSource/parsed_output && \
        chmod -R a+rwX /opt/airflow/DataSource/parsed_output && \
        chmod a+rwX /opt/airflow/DataSource/yaml_spec && \
        chmod a+rwX /opt/airflow/DataSource/code_projects && \
        find /opt/airflow/DataSource/yaml_spec -maxdepth 1 -mindepth 1 -type d ! -name '.*' -exec chmod -R a+rwX {} \; && \
        find /opt/airflow/DataSource/code_projects -maxdepth 1 -mindepth 1 -type d ! -name '.*' -exec chmod -R a+rwX {} \;
    volumes:
      - ./get_resources/DownloadTrigger/downloads:/opt/airflow/downloads
      - ./DataSource:/opt/airflow/DataSource

  airflow-init:
    build:
      context: .
      dockerfile: get_resources/DownloadTrigger/Dockerfile
    user: "50000:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    env_file: *airflow-env-file
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy
      perms-fix:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: .
      dockerfile: get_resources/DownloadTrigger/Dockerfile
    command: scheduler
    env_file: *airflow-env-file
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure

  airflow-webserver:
    build:
      context: .
      dockerfile: get_resources/DownloadTrigger/Dockerfile
    command: webserver
    ports:
      - "8080:8080"
    env_file: *airflow-env-file
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-paddyman_neo4j}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-db:
  neo4j-data:
  neo4j-logs:
